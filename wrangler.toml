name = "agentpki-issuer"
main = "src/index.ts"
compatibility_date = "2026-05-01"
workers_dev = true

# ─── REQUIRED: edit before first deploy ─────────────────────────────────
#
# If you registered your issuer at https://dashboard.agentpki.dev, the
# dashboard's Step 3 walkthrough generated copy-paste blocks for every
# value below — follow it from there for the easiest path. The full list
# of changes you need to make to this file:
#
# 1. (Optional) Rename `name` above — must be unique within your CF account.
#    e.g. `name = "agentpki-issuer-acme"`.
# 2. Replace the `[vars]` block below with the values from the dashboard.
# 3. Fill in ABUSE_CONTACT_EMAIL and SECURITY_CONTACT_EMAIL with real
#    inboxes you monitor (defaults are placeholders).
# 4. Create the issuer-state KV namespace and paste the id below:
#       npx wrangler kv namespace create ISSUER_STATE
# 5. Set the two secrets:
#       echo "<your-hex>" | npx wrangler secret put ISSUER_PRIVATE_KEY_HEX
#       (the dashboard provides this command pre-filled on the reveal page)
#       and a random 32+ char string for the internal /mint API:
#       npx wrangler secret put INTERNAL_MINT_SECRET
# 6. (Optional) Attach a custom domain — easier to do this via the Cloudflare
#    dashboard after deploy (Workers & Pages → your Worker → Triggers →
#    Custom Domains), but you can also uncomment + edit [[routes]] below.
# 7. Deploy:
#       npx wrangler deploy
# 8. Verify your well-known is serving:
#       curl https://<your-domain>/.well-known/agentpki-issuer.json
#
# Full spec: https://agentpki.dev/spec/v0.2

# Uncomment + edit to attach a custom domain (your issuer's hostname).
# Required if you want your issuer to be discoverable at /.well-known/...
# under your own domain rather than *.workers.dev.
#
# [[routes]]
# pattern = "your-issuer-domain.com"
# zone_name = "your-issuer-domain.com"
# custom_domain = true

# State storage: revoked passports, key rotation history, mint audit log
[[kv_namespaces]]
binding = "ISSUER_STATE"
id = "PASTE-KV-NAMESPACE-ID-HERE"

[vars]
ISSUER_DOMAIN = "your-issuer-domain.com"
ISSUER_NAME = "Your Company, Inc."
ISSUER_TIER = "1"
KID = "your-issuer-2026-q2"
# Long-lived keys; rotate by issuing a new KID and revoking the old via
# /admin/revoke-key. valid_from / valid_to defaults below give a 5-year
# window that you SHOULD shrink in production (90-day rotation recommended).
KEY_VALID_FROM = "1714521600"
KEY_VALID_TO   = "1893456000"
ABUSE_CONTACT_EMAIL    = "abuse@your-issuer-domain.com"
SECURITY_CONTACT_EMAIL = "security@your-issuer-domain.com"

# Secrets set via wrangler secret put:
#   ISSUER_PRIVATE_KEY_HEX   — 64 hex chars (32-byte Ed25519 seed)
#   INTERNAL_MINT_SECRET     — random 32+ char string for /mint auth
